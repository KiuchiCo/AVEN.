<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect AVEN.</title>
<style>:root{color-scheme:light dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F8F6F1;color:#2B2A27;font:15px/1.6 -apple-system,Inter,system-ui,sans-serif;padding:24px;box-sizing:border-box}@media(prefers-color-scheme:dark){body{background:#1d1c1a;color:#f3efe8}}main{width:100%;max-width:440px}h1{font:600 34px/1.15 "Playfair Display",Georgia,serif;margin:0 0 6px}p{color:#77766E;margin:0 0 22px}label{display:block;font-size:13px;margin-bottom:6px}input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #DCD9D0;border-radius:10px;font:inherit;background:#fff;color:#111}button{margin-top:14px;padding:11px 22px;border-radius:999px;border:1px solid #A48766;background:#A48766;color:#fff;font:inherit;cursor:pointer}#error{color:#963f32;min-height:22px;margin-top:10px;font-size:13px}</style></head>
<body><main><h1>AVEN.</h1><p>Your entire world, organised. Enter the address of your AVEN. server to connect this app.</p>
<form id="form"><label for="url">Server address</label><input id="url" name="url" type="url" required autofocus placeholder="https://aven.yourcompany.com" autocomplete="url"><button type="submit">Connect</button><div id="error" role="alert"></div></form></main>
<script>
document.getElementById('form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const error = document.getElementById('error'); error.textContent = '';
  const result = await window.avenDesktop.setServerUrl(document.getElementById('url').value);
  if (result && result.error) error.textContent = result.error;
});
</script></body></html>
