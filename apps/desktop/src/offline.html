<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AVEN. can’t connect</title>
<style>:root{color-scheme:light dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F8F6F1;color:#2B2A27;font:15px/1.6 -apple-system,Inter,system-ui,sans-serif;padding:24px;box-sizing:border-box}@media(prefers-color-scheme:dark){body{background:#1d1c1a;color:#f3efe8}}main{max-width:440px}h1{font:600 30px/1.2 "Playfair Display",Georgia,serif;margin:0 0 10px}p{color:#77766E;margin:0 0 20px}button{margin-right:10px;padding:10px 20px;border-radius:999px;border:1px solid #A48766;background:#A48766;color:#fff;font:inherit;cursor:pointer}button.plain{background:transparent;color:inherit}code{font-size:13px}</style></head>
<body><main><h1>AVEN. can’t connect</h1><p id="why">The server didn’t answer. Check your connection and try again.</p>
<button id="retry" type="button">Try again</button><button id="change" class="plain" type="button">Change server</button></main>
<script>
const why = new URLSearchParams(location.search).get('why'); if (why) document.getElementById('why').textContent = why;
document.getElementById('retry').onclick = () => window.avenDesktop.retry();
document.getElementById('change').onclick = () => window.avenDesktop.changeServer();
</script></body></html>
