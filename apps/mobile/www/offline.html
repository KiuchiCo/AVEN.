<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>AVEN.</title>
<style>
  :root { --bg: #F8F6F1; --ink: #2B2A27; --muted: #77766E; --bronze: #A48766; --border: #DCD9D0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #2B2A27; --ink: #F8F6F1; --muted: #BDB8AD; --border: #4a4843; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: var(--bg); color: var(--ink); font: 16px/1.6 -apple-system, "Inter", system-ui, sans-serif; text-align: center; }
  main { max-width: 420px; }
  h1 { font: 600 40px/1.1 "Playfair Display", Georgia, serif; margin: 0 0 6px; } h1 span { color: var(--bronze); }
  h2 { font: 500 22px/1.3 "Playfair Display", Georgia, serif; margin: 28px 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  button { min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px; background: var(--ink); color: var(--bg); font: inherit; font-weight: 600; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--bronze); outline-offset: 3px; }
  @media (prefers-reduced-motion: no-preference) { button { transition: opacity .15s; } button:active { opacity: .8; } }
</style>
</head>
<body>
<main role="main">
  <h1>AVEN<span>.</span></h1>
  <h2>Can’t reach AVEN. right now</h2>
  <p>Check your connection and try again. Anything you wrote and could not send is kept on this device.</p>
  <button type="button" id="retry">Try again</button>
</main>
<script>document.getElementById('retry').addEventListener('click', function () { location.reload(); });</script>
</body>
</html>
