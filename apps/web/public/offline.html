<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>AVEN. is offline</title>
<style>:root{color-scheme:light dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F8F6F1;color:#2B2A27;font:16px/1.6 Inter,system-ui,sans-serif;padding:0 16px}@media(prefers-color-scheme:dark){body{background:#1d1c1a;color:#f3efe8}}main{max-width:420px}h1{font:600 28px/1.2 "Playfair Display",Georgia,serif;margin:0 0 12px}p{margin:0 0 20px;color:#77766E}button{font:inherit;padding:10px 18px;border-radius:999px;border:1px solid #A48766;background:#A48766;color:#fff;cursor:pointer}</style></head>
<body><main><h1 id="t">You’re offline</h1><p id="d">AVEN. needs a connection to show your workspace and keep your changes safe. Reconnect and try again.</p><button id="b" type="button">Try again</button></main>
<script>
var text={es:['Sin conexión','AVEN. necesita conexión para mostrar tu espacio de trabajo y guardar tus cambios con seguridad. Vuelve a conectarte e inténtalo de nuevo.','Reintentar'],fr:['Vous êtes hors ligne','AVEN. a besoin d’une connexion pour afficher votre espace de travail et protéger vos modifications. Reconnectez-vous et réessayez.','Réessayer'],de:['Du bist offline','AVEN. braucht eine Verbindung, um deinen Arbeitsbereich anzuzeigen und deine Änderungen zu sichern. Verbinde dich erneut und versuche es noch einmal.','Erneut versuchen']}[(navigator.language||'en').slice(0,2)];
if(text){document.documentElement.lang=(navigator.language||'en').slice(0,2);document.getElementById('t').textContent=text[0];document.getElementById('d').textContent=text[1];document.getElementById('b').textContent=text[2]}
document.getElementById('b').onclick=function(){location.reload()};
</script></body></html>
