name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aven
          POSTGRES_PASSWORD: aven_ci
          POSTGRES_DB: aven
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aven" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://aven:aven_ci@localhost:5432/aven?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Migrations apply to an empty database
        run: npm run db:migrate:deploy
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Integration tests (real PostgreSQL, migrated above)
        run: npm run test:integration
        env:
          INTEGRATION_DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm run build
      - name: Browser tests (installed Chrome, public pages)
        run: npm run test:e2e --workspace @aven/web
