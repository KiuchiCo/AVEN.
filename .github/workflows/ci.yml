name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # the workflow only reads the repository

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aven
          POSTGRES_PASSWORD: aven_ci
          POSTGRES_DB: aven
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aven" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://aven:aven_ci@localhost:5432/aven?schema=public
    steps:
      # Actions are pinned to a commit, not a tag: a tag can be moved to different code later. Update deliberately (the comment names the release).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the secret scan reads the whole history
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Migrations apply to an empty database
        run: npm run db:migrate:deploy
      - run: npm run db:validate
      - run: npm run db:generate
      - name: Dependency audit (production dependencies, high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Package signatures (registry signatures and provenance of what was installed)
        run: npm audit signatures
      - name: Secret scan (every line ever added to Git; prints locations only, never values)
        run: node scripts/secret-scan.mjs history
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Component tests (rendered React, with accessibility rules)
        run: npm run test:components --workspace @aven/web
      - name: Integration tests (real PostgreSQL, migrated above)
        run: npm run test:integration
        env:
          INTEGRATION_DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm run build
      - name: Browser tests (installed Chrome: public pages, accessibility, responsive; signed-in tests are skipped without a Clerk test user)
        run: npm run test:e2e --workspace @aven/web
