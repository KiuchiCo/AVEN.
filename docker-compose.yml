services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aven}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aven-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-aven}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432" # local only: the database is never reachable from the network
    volumes:
      - aven-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aven} -d ${POSTGRES_DB:-aven}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aven-postgres-data:
